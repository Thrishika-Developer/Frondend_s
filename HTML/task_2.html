<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Registration Form</title>
    <link rel="icon" href="./assets/forms_image.jpg">
</head>

<body>
    <center>
        <h1>Job Registration Form</h1>
        <form action="" border="1">
            <label for="">First Name</label>
            <input type="text" required><br><br><br>
            <label for="">Last Name</label>
            <input type="text" required><br><br><br>
            <label for="">Honorifics</label>
            <select name="" id="">
                <option value="">select</option>
                <option value="">Mr.</option>
                <option value="">Ms.</option>
                <option value="">Miss.</option>
                <option value="">Mrs.</option>
            </select><br><br><br>
            <label for="">Gender</label>
            <input type="radio" name="Gender" required>Male
            <input type="radio" name="Gender" required>Female<br><br><br>
            <label for="">Date of Birth</label>
            <input type="date" required><br><br><br>
            <label for="">Skills</label>
            <input type="checkbox">Java Full Stack
            <input type="checkbox">Python Full Stack <br><br><br>
            <input type="checkbox">Data Analytics
            <input type="checkbox">Data science
            <br><br><br>
            <label for="">Resume</label>
            <input type="file" required><br><br>
            <label for="">Personal Details</label>
            <textarea name="" id=""></textarea><br><br><br>
            <input type="submit" value="submit">
            <input type="reset" value="reset">
        </form>
    </center>


</body>

</html>
